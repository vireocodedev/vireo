description = 'Base entity, service and mapper primitives, REST error handling, and the seams the optional modules plug into.'

dependencies {
    constraints {
        // Security floors that supersede versions currently selected through
        // the Spring Boot/Springdoc dependency graph. Publishing them as API
        // constraints protects both Gradle and Maven consumers of vireo-core.
        api "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
        api "org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}"
        api "org.apache.tomcat.embed:tomcat-embed-el:${tomcatVersion}"
        api "org.apache.tomcat.embed:tomcat-embed-websocket:${tomcatVersion}"
        api "org.webjars:swagger-ui:${swaggerUiVersion}"
    }

    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-security'
    api "org.mapstruct:mapstruct:${mapstructVersion}"
    api 'org.openapitools:jackson-databind-nullable:0.2.12'

    // Every module's controllers carry @Tag / @Operation, so this is part of
    // the compile surface rather than an implementation detail.
    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Optional on purpose. The library ships migrations and knows how to run
    // them, but a consumer managing their schema some other way should not
    // inherit Flyway; the migration strategy is @ConditionalOnClass.
    compileOnly 'org.flywaydb:flyway-core'
    compileOnly 'org.springframework.boot:spring-boot-flyway'
    // Observations activate only when the consumer provides an ObservationRegistry.
    // No metrics/tracing backend is pulled into the published runtime.
    compileOnly 'io.micrometer:micrometer-observation'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'
}
