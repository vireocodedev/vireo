group=com.vireocode

# The version of all six published artifacts. There is no changesets equivalent
# on this side, so this is bumped by hand in the pull request that warrants it.
# The release workflow publishes only when this version is not already in the
# registry, so leaving it alone on an npm-only release is a no-op rather than a
# failure. The api-surface.txt snapshots are the forcing function: a surface
# change cannot land without appearing in the same diff as this line.
version=0.4.0

springBootVersion=4.1.1
mapstructVersion=1.6.3
springdocVersion=3.1.0

# Security floors newer than the versions currently managed by the upstream
# Spring Boot and Springdoc platforms. Keep these explicit until the upstream
# lines manage versions containing the corresponding fixes.
jacksonDatabindVersion=2.22.2
swaggerUiVersion=5.32.14
tomcatVersion=11.0.25

# Testcontainers 2.0.5 still embeds the vulnerable shaded zerodep transport.
# Use its non-shaded sibling and resolve the patched Apache HTTP components.
dockerJavaVersion=3.7.1
httpClient5Version=5.6.4
httpCore5Version=5.4.3

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=fail
org.gradle.parallel=true
