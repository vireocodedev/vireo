description = 'Proves a consumer gets full wiring from the dependencies alone, and can replace any single bean. Never published.'

dependencies {
    testImplementation project(':vireo-core')
    testImplementation project(':vireo-auth')
    testImplementation project(':vireo-query')
    testImplementation project(':vireo-offline')
    testImplementation project(':vireo-history')

    testImplementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'

    // The controller tests drive the library's endpoints through MockMvc, which
    // is the only way to prove the auto-configured controllers are actually
    // mapped and actually secured rather than merely present as beans.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    testRuntimeOnly 'com.h2database:h2'

    // The library's migrations have to hold up on the vendor a consumer actually
    // deploys to, not only on the in-memory database the suite defaults to.
    testImplementation('org.testcontainers:testcontainers-junit-jupiter') {
        exclude group: 'com.github.docker-java', module: 'docker-java-transport-zerodep'
    }
    testImplementation('org.testcontainers:testcontainers-postgresql') {
        exclude group: 'com.github.docker-java', module: 'docker-java-transport-zerodep'
    }
    testImplementation "com.github.docker-java:docker-java-transport-httpclient5:${dockerJavaVersion}"
    // docker-java declares this as Maven-provided; javac needs the annotation
    // types while compiling the compatibility bridge below.
    testCompileOnly 'org.immutables:value:2.12.2'
    constraints {
        testImplementation "org.apache.httpcomponents.client5:httpclient5:${httpClient5Version}"
        testImplementation "org.apache.httpcomponents.core5:httpcore5:${httpCore5Version}"
        testImplementation "org.apache.httpcomponents.core5:httpcore5-h2:${httpCore5Version}"
    }
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
}
