plugins {
    id 'java-base'
    id 'com.adarshr.test-logger' version '4.0.0' apply false
    id 'org.cyclonedx.bom' version '3.5.0'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

def dependencyCheckSuppressions = layout.projectDirectory.file('config/dependency-check-suppressions.xml')
def nvdApiKey = providers.environmentVariable('NVD_API_KEY')

dependencyCheck {
    failBuildOnCVSS = 4.0
    failOnError = true
    failBuildOnUnusedSuppressionRule = true
    formats = ['HTML', 'JSON']
    skipTestGroups = false
    suppressionFile = dependencyCheckSuppressions.asFile.absolutePath
    if (nvdApiKey.isPresent()) {
        nvd.apiKey = nvdApiKey.get()
    }
}

// Dependency-Check enforces the `until` timestamp itself. This companion gate
// makes the repository policy explicit: every temporary exception must also
// identify an accountable owner, a rationale, and its private/public tracker.
def dependencySuppressionPolicy = tasks.register('dependencySuppressionPolicy') {
    group = 'verification'
    description = 'Rejects anonymous, untracked, or expired dependency vulnerability suppressions.'
    inputs.file(dependencyCheckSuppressions)

    doLast {
        def suppressions = new groovy.xml.XmlSlurper(false, false).parse(dependencyCheckSuppressions.asFile)
        suppressions.suppress.eachWithIndex { suppression, index ->
            def rule = index + 1
            def until = suppression.@until.text()
            if (!until) {
                throw new GradleException("Dependency suppression ${rule} must declare an until timestamp.")
            }

            java.time.Instant expiry = null
            try {
                expiry = java.time.Instant.parse(until)
            } catch (java.time.format.DateTimeParseException ignored) {
                throw new GradleException(
                        "Dependency suppression ${rule} has invalid until timestamp '${until}'; use UTC ISO-8601.")
            }
            if (!expiry.isAfter(java.time.Instant.now())) {
                throw new GradleException("Dependency suppression ${rule} expired at ${until}.")
            }

            def notes = suppression.notes.text()
            ['owner', 'rationale', 'tracking'].each { field ->
                if (!(notes =~ /(?m)^${field}=\S.*$/).find()) {
                    throw new GradleException(
                            "Dependency suppression ${rule} notes must include '${field}=...'.")
                }
            }
        }
    }
}

tasks.named('dependencyCheckAggregate') {
    dependsOn dependencySuppressionPolicy
}

// The artifacts a consumer resolves. Everything else in this build exists to
// produce or to prove them, and must never reach a registry — in particular
// vireo-starter-autoconfigure-tests, which is a consumer simulation.
ext.publishedModules = [
        'vireo-core',
        'vireo-auth',
        'vireo-query',
        'vireo-offline',
        'vireo-history',
        'vireo-bom',
]

// Release evidence describes only the six public artifacts. Documentation and
// consumer-test projects are verification fixtures, not shipped components.
tasks.named('cyclonedxDirectBom') {
    enabled = false
}
configure(subprojects) {
    tasks.named('cyclonedxDirectBom') {
        enabled = project.name in rootProject.ext.publishedModules
        includeConfigs = ['compileClasspath', 'runtimeClasspath']
        skipConfigs = ['(?i).*test.*']
        testConfigs = []
    }
}

repositories {
    mavenCentral()
}

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

// The BOM is a java-platform, so it deliberately opts out of the Java
// convention below. Everything else is a plain library: no Spring Boot plugin,
// because these modules are consumed as jars and must never produce a fat jar
// or an executable manifest.
configure(subprojects.findAll { it.name != 'vireo-bom' }) {
    apply plugin: 'java-library'
    apply plugin: 'com.adarshr.test-logger'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        // Building the javadoc jar is the only thing that actually compiles the
        // doc comments, and a library's docs are part of its surface.
        withSourcesJar()
        withJavadocJar()
    }

    // Catches broken {@link} targets and malformed HTML, which are the doc
    // defects that mislead a consumer. "-missing" because requiring an @param
    // on every method buys noise rather than accuracy.
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    // Spring MVC resolves @PathVariable / @RequestParam / @RequestBody argument
    // names by reflection. The Spring Boot Gradle plugin normally adds this for
    // us; these modules do not apply it, so it has to be explicit.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
        options.encoding = 'UTF-8'
    }

    dependencies {
        // Gradle's own platform import rather than io.spring.dependency-management.
        // The plugin captures the Project in the POM it generates, which the
        // configuration cache cannot serialize, and a platform dependency is
        // published as a real dependencyManagement import so Maven consumers
        // inherit the same alignment we compiled against.
        def springBootPlatform = platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        api springBootPlatform
        // compileOnly and the annotation processor paths do not extend api, so
        // versionless dependencies on them need the platform spelled out.
        compileOnly springBootPlatform
        annotationProcessor springBootPlatform
        testCompileOnly springBootPlatform
        testAnnotationProcessor springBootPlatform

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        compileOnly "org.projectlombok:lombok-mapstruct-binding:0.2.0"
        annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(
                    rootProject.providers.gradleProperty('vireoTestJavaVersion').getOrElse('21') as Integer)
        }
        ['vireo.postgres.enabled', 'vireo.postgres.image'].each { propertyName ->
            def propertyValue = System.getProperty(propertyName)
            if (propertyValue != null) {
                systemProperty propertyName, propertyValue
            }
        }
    }

    // Public binary artifacts carry the license with the compiled code rather
    // than relying on a consumer to find the repository-level file.
    tasks.named('processResources') {
        from(rootProject.file('../LICENSE')) {
            into 'META-INF'
            rename { 'LICENSE' }
        }
    }
}

// One browsable documentation tree for the complete published Java API. The
// per-module javadoc tasks still build the artifacts attached to each Maven
// publication; this task additionally proves that links across library
// boundaries resolve when the family is viewed as one API.
def documentedModules = subprojects.findAll {
    it.name in rootProject.ext.publishedModules && it.name != 'vireo-bom'
}
def aggregateJavadocClasspath = configurations.create('aggregateJavadocClasspath') {
    canBeConsumed = false
    canBeResolved = true
    description = 'Root-owned classpath used to render the complete published JVM API.'
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }
}

dependencies {
    add(aggregateJavadocClasspath.name, platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
    documentedModules.each {
        add(aggregateJavadocClasspath.name, project(it.path))
    }
    add(aggregateJavadocClasspath.name, 'org.projectlombok:lombok')
    add(aggregateJavadocClasspath.name, 'org.flywaydb:flyway-core')
    add(aggregateJavadocClasspath.name, 'org.springframework.boot:spring-boot-flyway')
}

tasks.register('aggregateJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Generates one Javadoc site for every published JVM library.'
    title = "Vireo Starter JVM ${project.version} API"
    source documentedModules.collect { it.sourceSets.main.allJava }
    classpath = aggregateJavadocClasspath
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    dependsOn documentedModules.collect { it.tasks.named('classes') }
}

// The public-API gate, and the reason it is a committed snapshot rather than a
// diff against the last release: a snapshot works before the first release
// exists, works with no network, and puts the surface change in the diff next to
// the version bump that should accompany it. That is where a reviewer will
// actually see it. This mirrors scripts/public-surface.mjs on the npm side.
configure(subprojects.findAll { it.name in rootProject.ext.publishedModules && it.name != 'vireo-bom' }) {
    def surface = layout.projectDirectory.file('api-surface.txt')

    def surfaceUpdate = tasks.register('apiSurfaceUpdate', com.vireocode.build.ApiSurfaceUpdateTask) {
        group = 'verification'
        description = 'Accepts the current public API as the new snapshot.'
        classes.from(sourceSets.main.output.classesDirs)
        classpath.from(sourceSets.main.compileClasspath)
        surfaceFile.set(surface)
        dependsOn tasks.named('classes')
    }

    def surfaceCheck = tasks.register('apiSurfaceCheck', com.vireocode.build.ApiSurfaceCheckTask) {
        group = 'verification'
        description = 'Fails when the public API has drifted from its snapshot.'
        moduleName.set(project.name)
        classes.from(sourceSets.main.output.classesDirs)
        classpath.from(sourceSets.main.compileClasspath)
        baseline.set(surface)
        upToDateMarker.set(layout.buildDirectory.file('api-surface/checked.txt'))
        dependsOn tasks.named('classes')
    }

    tasks.named('check') {
        dependsOn surfaceCheck
    }

    // Publishing a widened surface without noticing is the failure this pairing
    // prevents: the jar cannot be built for release without the check passing.
    tasks.withType(AbstractPublishToMaven).configureEach {
        dependsOn surfaceCheck
    }
}

// Publishing is deliberately local-first. Ordinary builds and the isolated
// consumer proof need no credentials. A Maven Central bundle is requested only
// with -PvireoCentralRepository and is the only path that requires the in-memory
// signing key supplied by the protected release environment.
configure(subprojects.findAll { it.name in rootProject.ext.publishedModules }) {
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    def centralBundleRequested = rootProject.hasProperty('vireoCentralRepository')
    def signingKey = System.getenv('MAVEN_SIGNING_KEY') ?: findProperty('vireoSigningKey')
    def signingPassword = System.getenv('MAVEN_SIGNING_PASSWORD') ?: findProperty('vireoSigningPassword')

    if (centralBundleRequested && (!signingKey || !signingPassword)) {
        throw new GradleException(
                'A Central bundle requires MAVEN_SIGNING_KEY and MAVEN_SIGNING_PASSWORD.')
    }

    publishing {
        publications {
            maven(MavenPublication) {
                pom {
                    name = project.name
                    description = project.description
                    url = 'https://vireocode.com/reference/java/'
                    inceptionYear = '2025'
                    organization {
                        name = 'Vireo Code'
                        url = 'https://vireocode.com/'
                    }
                    issueManagement {
                        system = 'GitHub Issues'
                        url = 'https://github.com/vireocodedev/vireo/issues'
                    }
                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://github.com/vireocodedev/vireo/blob/main/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'vireocodedev'
                            name = 'Vireo Code'
                            email = '53398175+brunotot@users.noreply.github.com'
                            url = 'https://github.com/vireocodedev'
                            organization = 'Vireo Code'
                            organizationUrl = 'https://github.com/vireocodedev'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/vireocodedev/vireo.git'
                        developerConnection = 'scm:git:ssh://git@github.com/vireocodedev/vireo.git'
                        url = 'https://github.com/vireocodedev/vireo'
                        tag = 'HEAD'
                    }
                }
            }
        }

        repositories {
            // A pre-release consumer check publishes every artifact into one
            // throwaway repository. It is opt-in so ordinary `publish` cannot
            // accidentally write a verification repository into the checkout.
            if (rootProject.hasProperty('vireoTestRepository')) {
                maven {
                    name = 'Verification'
                    url = uri(rootProject.property('vireoTestRepository'))
                }
            }

            // The Publisher Portal accepts one atomic Maven-layout archive.
            // Gradle writes the complete signed repository locally; the bundle
            // script then audits and archives it before any network operation.
            if (centralBundleRequested) {
                maven {
                    name = 'CentralBundle'
                    url = uri(rootProject.property('vireoCentralRepository'))
                }
            }
        }
    }

    signing {
        required = { centralBundleRequested }
        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.maven
    }

    // The component has to be attached once the plugin that owns it is applied.
    // The root project is evaluated before the BOM's own build file runs, so
    // neither component exists yet at the point the publication is declared.
    plugins.withId('java-library') {
        publishing.publications.named('maven') { from components.java }
    }
    plugins.withId('java-platform') {
        publishing.publications.named('maven') { from components.javaPlatform }
    }

    // Same reason, and it has to be read rather than deferred: a provider that
    // closes over the project is not serializable by the configuration cache.
    afterEvaluate {
        publishing.publications.named('maven') { pom.description.set(project.description) }
    }
}
