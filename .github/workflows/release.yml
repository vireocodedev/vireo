name: Release · Prepare version PR
run-name: Release preparation · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Create or update the ecosystem release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: template-adoption
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack npm ci --ignore-scripts
      - name: Prepare a JVM-only Changesets trigger when required
        run: node scripts/prepare-jvm-only-release-trigger.mjs
      - id: app-token
        name: Mint the repository-scoped GitHub App token
        env:
          TEMPLATE_ADOPTION_APP_ID: ${{ vars.TEMPLATE_ADOPTION_APP_ID }}
          TEMPLATE_ADOPTION_APP_PRIVATE_KEY: ${{ secrets.TEMPLATE_ADOPTION_APP_PRIVATE_KEY }}
        run: node scripts/create-template-adoption-app-token.mjs
      - name: Create or update the Changesets ecosystem release PR
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: corepack npm run version-packages
          commit: "chore(release): version public ecosystem"
          title: "chore(release): version public ecosystem"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
