name: Release · Anonymous production gauntlet
run-name: Release gauntlet · ${{ github.event_name }} · ${{ github.event.workflow_run.head_sha || inputs.source_commit || github.sha }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        required: false
        type: string
      source_commit:
        required: false
        type: string
  workflow_run:
    workflows: ["Release · Publish npm and Maven"]
    types: [completed]
  schedule:
    - cron: "17 3 * * 2"

permissions: {}

concurrency:
  group: anonymous-consumer-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-activity:
    name: Classify exact combined release activity
    if: >-
      always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      any-activity: ${{ steps.activity.outputs.any-activity }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/release-workflow-activity.mjs

  trusted-source:
    name: Select trusted public source
    needs: release-activity
    if: >-
      always() && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.release-activity.result == 'success' && needs.release-activity.outputs.any-activity == 'true'))
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_RUN_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$WORKFLOW_REF" != refs/heads/main ]; then
            echo "workflow_dispatch is restricted to refs/heads/main" >&2
            exit 1
          fi
          if [ -n "$REQUESTED_SOURCE_COMMIT" ] && ! printf '%s' "$REQUESTED_SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "workflow_dispatch source_commit must be an exact 40-hex commit" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          candidate="$REQUESTED_SOURCE_COMMIT"
          if [ -z "$candidate" ] && [ "$EVENT_NAME" = workflow_run ]; then candidate="$WORKFLOW_RUN_SOURCE_COMMIT"; fi
          if [ -z "$candidate" ]; then candidate="$(git rev-parse origin/main)"; fi
          git rev-parse --verify "$candidate^{commit}" >/dev/null
          if ! git merge-base --is-ancestor "$candidate" origin/main; then
            echo "source_commit must be an ancestor of fetched origin/main" >&2
            exit 1
          fi
          echo "source_commit=$candidate" >> "$GITHUB_OUTPUT"

  gauntlet:
    name: Run anonymous zero-to-production gauntlet
    needs: trusted-source
    if: always() && needs.trusted-source.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions: {}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch the trusted public source without credentials
        env:
          TRUSTED_SOURCE_COMMIT: ${{ needs.trusted-source.outputs.source_commit }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$TRUSTED_SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TRUSTED_SOURCE_COMMIT"
      - run: corepack npm ci --ignore-scripts
      - run: docker version
      - run: corepack npm exec -- playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vireo-anonymous-playwright
      - name: Run exact public anonymous-consumer gauntlet
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vireo-anonymous-playwright
          VIREO_GAUNTLET_RELEASE_ID: ${{ inputs.release_id }}
          VIREO_GAUNTLET_SOURCE_COMMIT: ${{ needs.trusted-source.outputs.source_commit }}
          VIREO_GAUNTLET_PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vireo-anonymous-playwright
        run: >-
          corepack npm run consumer:gauntlet --
          --evidence-dir "$RUNNER_TEMP/anonymous-consumer-evidence"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-consumer-gauntlet-evidence
          path: ${{ runner.temp }}/anonymous-consumer-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Summarize gauntlet outcome
        if: always()
        run: |
          {
            echo "## Anonymous production gauntlet"
            echo
            echo "- Evidence is retained for 90 days."
            echo "- Signed SBOM verification follows only after a successful gauntlet."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-signed-sboms:
    name: Verify signed public SBOM attestations
    needs: [gauntlet, trusted-source]
    if: >-
      always() && github.event_name != 'pull_request' && needs.gauntlet.result == 'success' && needs.trusted-source.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted-source.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate trusted main ancestry before verifier execution
        env:
          TRUSTED_SOURCE_COMMIT: ${{ needs.trusted-source.outputs.source_commit }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify "$TRUSTED_SOURCE_COMMIT^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$TRUSTED_SOURCE_COMMIT"
          git merge-base --is-ancestor "$TRUSTED_SOURCE_COMMIT" origin/main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anonymous-consumer-gauntlet-evidence
          path: ${{ runner.temp }}/anonymous-consumer-evidence
      - name: Verify every exact public subject's signed CycloneDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/verify-anonymous-consumer-signed-sboms.mjs
          --evidence-dir "$RUNNER_TEMP/anonymous-consumer-evidence"
          --output "$RUNNER_TEMP/anonymous-consumer-signed-sbom-evidence/signed-sbom-verification.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-consumer-signed-sbom-evidence
          path: ${{ runner.temp }}/anonymous-consumer-signed-sbom-evidence
          if-no-files-found: error
          retention-days: 90
