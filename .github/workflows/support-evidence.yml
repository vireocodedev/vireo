name: Scheduled · Compatibility evidence
run-name: Compatibility evidence · ${{ github.event_name }} · ${{ github.sha }}

on:
  schedule:
    - cron: "7 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: support-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  java-25:
    name: Java 25 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Java 21 compiler toolchain
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Select the Java 25 test runtime
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./jvm/gradlew -p jvm clean build aggregateJavadoc -PvireoTestJavaVersion=25 --no-build-cache
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_CACHE: warm-wrapper-clean-build
          VIREO_EVIDENCE_COMMAND: ./jvm/gradlew -p jvm clean build aggregateJavadoc -PvireoTestJavaVersion=25 --no-build-cache
          VIREO_EVIDENCE_JAVA_TARGET: "25"
        run: node scripts/write-support-evidence.mjs java-25 ${{ job.status }} .support-evidence/java-25.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-java-25-${{ github.run_id }}-${{ github.run_attempt }}
          path: .support-evidence/java-25.json
          if-no-files-found: error
          retention-days: 14

  postgres:
    name: PostgreSQL ${{ matrix.postgresql }} migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["17", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Require Docker
        run: docker info
      - name: Run the real PostgreSQL upgrade fixture
        run: >-
          ./jvm/gradlew -p jvm
          :vireo-starter-autoconfigure-tests:test
          --tests com.vireocode.consumer.PostgresLibraryUpgradeTest
          -Dvireo.postgres.enabled=true
          -Dvireo.postgres.image=postgres:${{ matrix.postgresql }}-alpine
          --no-build-cache
      - name: Resolve tested image digest
        if: always()
        run: echo "VIREO_EVIDENCE_IMAGE=$(docker image inspect postgres:${{ matrix.postgresql }}-alpine --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_CACHE: ordinary-gradle-cache
          VIREO_EVIDENCE_COMMAND: PostgresLibraryUpgradeTest
          VIREO_EVIDENCE_POSTGRESQL: ${{ matrix.postgresql }}
        run: node scripts/write-support-evidence.mjs postgres-${{ matrix.postgresql }} ${{ job.status }} .support-evidence/postgres-${{ matrix.postgresql }}.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-postgres-${{ matrix.postgresql }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .support-evidence/postgres-${{ matrix.postgresql }}.json
          if-no-files-found: error
          retention-days: 14

  peer-floors:
    name: Required and optional peer floors
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack npm ci
      - run: corepack npm run build
      - run: corepack npm run peer-floor:check
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_CACHE: fresh-consumer-cache
          VIREO_EVIDENCE_COMMAND: corepack npm run peer-floor:check
        run: node scripts/write-support-evidence.mjs peer-floors ${{ job.status }} .support-evidence/peer-floors.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-peer-floors-${{ github.run_id }}-${{ github.run_attempt }}
          path: .support-evidence/peer-floors.json
          if-no-files-found: error
          retention-days: 14

  public-consumers:
    name: Anonymous npm and Maven consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: corepack npm ci --ignore-scripts
      - name: Resolve and authenticate public npm packages from a fresh consumer cache
        run: corepack npm run release:verify-public
      - name: Resolve the public Maven BOM and modules from a fresh Gradle home
        run: ./jvm/scripts/verify-central-consumer.sh
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_CACHE: fresh-npm-and-gradle-consumer-caches
          VIREO_EVIDENCE_COMMAND: corepack npm run release:verify-public; ./jvm/scripts/verify-central-consumer.sh
          VIREO_EVIDENCE_REGISTRIES: registry.npmjs.org,repo.maven.apache.org
        run: node scripts/write-support-evidence.mjs public-consumers ${{ job.status }} .support-evidence/public-consumers.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-public-consumers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .support-evidence/public-consumers.json
            npm-public-verification.json
          if-no-files-found: error
          retention-days: 90

  clean-container:
    name: Clean Node container
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: node:24.18.1-bookworm-slim@sha256:a09aabc645e86e81e23dab78e0c0f2eaa233cab4277c7188232181a1a8bd5d39
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install clean-container verification prerequisites
        run: apt-get update && apt-get install --yes --no-install-recommends jq time
      - run: corepack npm ci
      - name: Install Storybook contract browser
        run: corepack npm exec -- playwright install --with-deps chromium
      - run: corepack npm run verify -- silent
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_CACHE: empty-container
          VIREO_EVIDENCE_COMMAND: corepack npm run verify -- silent
          VIREO_EVIDENCE_CONTAINER: node:24.18.1-bookworm-slim@sha256:a09aabc645e86e81e23dab78e0c0f2eaa233cab4277c7188232181a1a8bd5d39
        run: node scripts/write-support-evidence.mjs clean-node-container ${{ job.status }} .support-evidence/clean-node-container.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-clean-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: .support-evidence/clean-node-container.json
          if-no-files-found: error
          retention-days: 14
