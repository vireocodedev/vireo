name: Attest public release SBOMs
run-name: Release · Attest public SBOMs · ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release · Publish npm and Maven
      - Recovery · Verify Maven publication
    branches: [main]
    types:
      - completed

concurrency:
  group: attest-public-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  activity:
    name: Classify exact public release activity
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      any-activity: ${{ steps.activity.outputs.any-activity }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: activity
        env:
          PARENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          GITHUB_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$PARENT_WORKFLOW" = "Recovery · Verify Maven publication" ]; then
            echo "any-activity=true" >> "$GITHUB_OUTPUT"
          elif [ "$PARENT_WORKFLOW" = "Release · Publish npm and Maven" ]; then
            node scripts/release-workflow-activity.mjs
          else
            echo "Unexpected workflow_run parent: $PARENT_WORKFLOW" >&2
            exit 1
          fi

  collect:
    name: Collect and classify exact public artifacts
    needs: activity
    if: >-
      always() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository && needs.activity.result == 'success' &&
      needs.activity.outputs.any-activity == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.mapping.outputs.matrix }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: corepack npm ci --ignore-scripts
      - name: Collect exact public artifacts and current SBOMs
        run: corepack npm run release:collect-public-evidence
      - name: Validate one-to-one SBOM ownership
        id: mapping
        run: node scripts/validate-release-sbom-evidence.mjs .public-release-evidence --github-matrix >> "$GITHUB_OUTPUT"
      - name: Require a clean source checkout
        run: test -z "$(git status --porcelain)"
      - name: Preserve classified exact-byte evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release-sbom-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: .public-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Bind ${{ matrix.id }} SBOM to its exact public subject
    needs: collect
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect.outputs.matrix) }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-release-sbom-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: .public-release-evidence
      - name: Attest the subject-specific SBOM
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ matrix.checksums }}
          sbom-path: ${{ matrix.sbom }}
      - name: Verify the published attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r _ subject; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom \
              --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/attest-public-release.yml@refs/heads/main" \
              --source-ref refs/heads/main
          done < "${{ matrix.checksums }}"
      - name: Preserve the subject-specific signed bundle
        if: always() && steps.attestation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release-sbom-attestation-${{ matrix.id }}-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            ${{ matrix.sbom }}
            ${{ matrix.checksums }}
            ${{ steps.attestation.outputs.bundle-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Summarize signed SBOM attestation
        if: always()
        env:
          SUBJECT: ${{ matrix.id }}
        run: |
          printf '## Signed SBOM attestation\n\n- Subject: `%s`\n- Exact subject evidence is retained for 90 days.\n' "$SUBJECT" >> "$GITHUB_STEP_SUMMARY"
